<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Tooltip Test</title>
    <link rel="stylesheet" href="website/static/dist/css/idiary.min.css">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-6">Card Tooltip 测试页面</h1>
        
        <!-- 模拟日记卡片 -->
        <div class="card mb-4">
            <div class="card-title">
                <h2 class="text-lg font-semibold">测试日记标题</h2>
            </div>
            <div class="card-content">
                <p class="mb-4">这是一个测试日记的内容。我们需要测试tooltip是否能在card容器中正常显示。</p>
                
                <!-- 测试不同位置的tooltip -->
                <div class="flex gap-4 mb-4">
                    <button class="btn" 
                            data-tooltip="这是一个顶部tooltip" 
                            data-tooltip-position="top">
                        顶部Tooltip
                    </button>
                    
                    <button class="btn" 
                            data-tooltip="这是一个右侧tooltip" 
                            data-tooltip-position="right">
                        右侧Tooltip
                    </button>
                    
                    <button class="btn" 
                            data-tooltip="这是一个底部tooltip" 
                            data-tooltip-position="bottom">
                        底部Tooltip
                    </button>
                    
                    <button class="btn" 
                            data-tooltip="这是一个左侧tooltip" 
                            data-tooltip-position="left">
                        左侧Tooltip
                    </button>
                </div>
                
                <!-- 模拟日记操作按钮 -->
                <div class="flex justify-end gap-2">
                    <div class="post-edit absolute top-2 right-2 z-10">
                        <a href="#" class="tooltip-link" 
                           data-tooltip-target="edit-menu" 
                           data-tooltip-position="bottom-left" 
                           data-tooltip-event="click">
                            <i class="mdi mdi-dots-vertical"></i>
                        </a>
                        <div id="edit-menu" class="tooltip hidden">
                            <a href="#" class="tooltip-link">编辑</a>
                            <a href="#" class="tooltip-link">删除</a>
                            <a href="#" class="tooltip-link">分享</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 另一个测试卡片 -->
        <div class="card">
            <div class="card-title">
                <h2 class="text-lg font-semibold">第二个测试卡片</h2>
            </div>
            <div class="card-content">
                <p class="mb-4">这是第二个测试卡片，用于验证多个卡片之间的tooltip不会相互干扰。</p>
                
                <div class="flex gap-4">
                    <span data-tooltip="这个tooltip应该能超出卡片边界显示" 
                          data-tooltip-position="top" 
                          class="cursor-pointer text-blue-500 underline">
                        悬停查看长tooltip
                    </span>
                    
                    <span data-tooltip="短tooltip" 
                          data-tooltip-position="bottom" 
                          class="cursor-pointer text-green-500 underline">
                        短tooltip测试
                    </span>
                </div>
            </div>
        </div>
        
        <!-- 测试说明 -->
        <div class="mt-8 p-4 bg-blue-100 rounded-lg">
            <h3 class="font-semibold mb-2">测试说明：</h3>
            <ul class="list-disc list-inside space-y-1 text-sm">
                <li>悬停按钮应该显示tooltip</li>
                <li>tooltip应该能够超出card边界显示</li>
                <li>点击菜单按钮应该显示下拉菜单</li>
                <li>tooltip应该有正确的定位和层级</li>
                <li>不同位置的tooltip应该正确显示</li>
            </ul>
        </div>
    </div>
    
    <!-- 引入jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- 引入Kiko UI框架 -->
    <script src="kiko/dist/kiko.js"></script>
    <script>
        // 初始化Kiko UI
        document.addEventListener('DOMContentLoaded', function() {
            kiko.init({
                debug: true,
                animation: true,
                errorHandler: function(error) {
                    console.error('Kiko Error:', error);
                }
            });
            
            console.log('Card Tooltip Test Page Loaded');
            console.log('Kiko UI initialized:', kiko);
            console.log('Tooltip module:', kiko.ui.tooltip);
        });
    </script>
</body>
</html>
