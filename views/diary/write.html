{{define "diary/write"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="main-body p-5 py-4">
    <div class="info-cover">
        <div id="page-nav">
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link"  href="/u/{{.UserData.UserId}}" >{{.UserData.UserName}}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"  href="#"><span class="mdi mdi-slash-forward"></span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">写日记</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><span class="mdi mdi-square-small"></span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">草稿箱</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><span class="mdi mdi-square-small"></span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">回收站</a>
                </li>
            </ul>
        </div>
    </div>

    <form id="diary_editor_form">
        <div class="row col-md-8 offset-md-2 p-5">
            <div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="info_title" name="info_title" placeholder="标题(非必填)">
                    <label for="info_title">标题(非必填)</label>
                </div>
                <div class="form-floating mb-3">
                    <select class="form-select" id="space_id" name="space_id">
                        {{range .Spaces}}
                        <option value="{{.SpaceID}}">{{.Title}}</option>
                        {{end}}
                    </select>
                    <label for="info_title">日记本</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="info_body" name="info_body" rows="8" placeholder="日记内容"
                        style="height: 300px;"></textarea>
                    <label for="info_body">日记内容</label>
                </div>
            </div>
            <div>
                <button type="button" class="ms-auto btn btn-outline-secondary px-5 mx-5"
                    onclick="Biuren.Diary.postInfo()">发布</button>
                <button type="button" class="ms-auto btn btn-outline-secondary"
                    onclick="Biuren.Diary.postInfo()">保存草稿</button>
            </div>
        </div>
    </form>
</div>
{{template "scripts" .}}

<script>

</script>

{{template "footer" .}}
{{end}}
