{{define "diary/write_form"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-sm-10">
            <div class="card card-form-theme my-3">
                <form>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="exampleFormControlSelect1">日记本</label>
                            <select class="form-control" id="exampleFormControlSelect1">
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="exampleFormControlInput1">标题</label>
                            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                        </div>
                        <div class="form-group">
                            <label for="exampleFormControlTextarea1">内容</label> 
                            <label class="float-right" id="auto-save-label">自动保存：6:23</label>
                            <textarea class="form-control" id="diary-content" rows="15"></textarea>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button type="submit" class="btn btn-primary" onclick="alert(simplemde.value())">发布</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>



{{template "scripts" .}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
<link rel="stylesheet" href="/public/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script>
    var simplemde = new SimpleMDE({
        element: $("#diary-content")[0],
        autoDownloadFontAwesome: false,
        spellChecker: false,
        status: false,
        toolbar: ["bold", "italic", "heading", "|", "quote",
            "unordered-list", "ordered-list", "|", "preview"
        ],
    });
    //simplemde.codemirror.replaceSelection() ，插入光标
</script>

{{template "footer" .}}
{{end}}
