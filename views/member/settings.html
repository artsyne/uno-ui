{{define "member/settings"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="main-body px-5 py-4">
    <!--封面信息-->
    <div class="info-cover">
        <div class="d-flex">
            <div class="me-auto">
                <div id="page-nav"><a href="#" class="pe-3">roy chen</a> / <a href="#ss">Settings</a></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card border-0 mb-4">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Profile</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3 text-center"><img class="rounded" style="width: 150px;"
                            src="https://pbs.twimg.com/profile_images/1762062628552396800/K6bcqY9T_400x400.jpg" /></div>
                    <!-- Full name -->
                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Full name" value="{{.UserInfo.FullName}}">
                        </div>
                    </div>
                    <!-- Bio -->
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control"
                            rows="3" valid="[{type:'limit',max:250,show:true}]">I’ve found a way to get paid for my favorite hobby, and do so while following my dream of traveling the world.</textarea>
                        <div class="form-text">Brief description for your profile.</div>
                    </div>
                    <!-- Save button -->
                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="btn text-secondary border-0 me-2">Discard</a>
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Save changes</a>
                    </div>
                </div>
            </div>

            <div class="card border-0 mb-4">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Email</h5>
                </div>
                <div class="card-body">
                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" value="{{.UserInfo.Email}}">
                    </div>
                    <!-- Save button -->
                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Save changes</a>
                    </div>
                </div>
            </div>


            <div class="card border-0">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Update password</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Current password</label>
                        <input class="form-control" type="password" placeholder="Enter current password">
                    </div>
                    <!-- New password -->
                    <div class="mb-3">
                        <label class="form-label" id="psw-strength-message"></label>
                        <div class="input-group">
                            <input class="form-control fakepassword" type="password" id="psw-input"
                                placeholder="Enter new password">
                            <span class="input-group-text p-0">
                                <i class="fakepasswordicon far fa-eye cursor-pointer p-2 w-40px"></i>
                            </span>
                        </div>
                        <div class="rounded mt-1" id="psw-strength"></div>
                    </div>
                    <!-- New password -->
                    <div>
                        <label class="form-label">Confirm new password</label>
                        <input class="form-control" type="password" placeholder="Enter new password">
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Change password</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



{{template "scripts" .}}

<script>



</script>


{{template "footer" .}}
{{end}}
