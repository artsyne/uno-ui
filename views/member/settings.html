{{define "member/settings"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="main-body px-5 py-4">
    <!--封面信息-->
    <div class="info-cover">
        <div id="page-nav">
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link" href="/u/{{.UserData.UserId}}">{{.UserData.UserName}}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><span class="mdi mdi-slash-forward"></span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Settings</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card border-0 mb-4">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Profile</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3 text-center"><img class="rounded" style="width: 150px;"
                            src="https://pbs.twimg.com/profile_images/1762062628552396800/K6bcqY9T_400x400.jpg" /></div>
                    <!-- Full name -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Full name"
                            value="{{.UserInfo.FullName}}">
                        <label for="full_name">Full name</label>
                    </div>
                    <!-- Bio -->
                    <div class="form-floating mb-3">
                        <textarea type="text" class="form-control" id="remark" name="remark" placeholder="Bio" rows="3"
                            valid="[{type:'limit',max:250,show:true}]"
                            style="height: 120px;">I’ve found a way to get paid for my favorite hobby, and do so while following my dream of traveling the world.</textarea>
                        <label for="remark">Bio</label>
                    </div>
                    <!-- Save button -->
                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="btn text-secondary border-0 me-2">Discard</a>
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Save changes</a>
                    </div>
                </div>
            </div>

            <div class="card border-0 mb-4">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Email</h5>
                </div>
                <div class="card-body">
                    <!-- Email -->
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                            type="email" value="{{.UserInfo.Email}}">
                        <label for="email">Email</label>
                    </div>
                    <!-- Save button -->
                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Save changes</a>
                    </div>
                </div>
            </div>


            <div class="card border-0">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="card-header-title mb-0">Update password</h5>
                </div>
                <div class="card-body">

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="current_pwd" name="current_pwd"
                            placeholder="Current password">
                        <label for="current_pwd">Current password</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="new_pwd" name="new_pwd"
                            placeholder="New password">
                        <label for="new_pwd">New password</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="confirm_pwd" name="confirm_pwd"
                            placeholder=" Confirm new password">
                        <label for="confirm_pwd"> Confirm new password</label>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="#" class="ms-auto btn btn-outline-secondary  px-4">Change password</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



{{template "scripts" .}}

<script>



</script>


{{template "footer" .}}
{{end}}
