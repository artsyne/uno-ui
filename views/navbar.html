{{define "navbar"}}

<header class="sticky-top p-2 bg-light mb-4">
    <div class="container-fluid d-flex justify-content-between ">
        <div class="d-flex align-items-center">
            <h1 class="fs-4 mb-0">
                <a href="/" class="navbar-brand mr-2 text-secondary">
                    i<font color="#dc3545">D</font>iary.ai
                </a>
            </h1>
        </div>
        <div class="d-flex top-nav align-items-center">
        </div>
        <div class="d-flex align-items-center">
            {{if not .IsLogin }}
            <a class="nav-link text-black-50 fs-6" href="/register" role="button"><i class="fa fa-id-card-o"></i>
                免费注册</a>
            <a class="nav-link text-black-50 fs-6" href="/login" role="button"><i class="fa fa-sign-in"></i> 登录</a>
            {{else}}
            <a class="btn btn-outline-secondary mx-2 px-3" role="button" href="/write">
                <i class="mdi mdi-plus"></i>写日记</a>

            <div class="dropdown ms-1">
                <a id="user_drop" href="#" class="nav-link dropdown-toggle text-black-50 p-0" role="button"
                    data-bs-toggle="dropdown">
                    <img style="width:38px;" src="/public/img/face.jpg" />
                </a>
                <ul id="user_menu" class="dropdown-menu p-3" aria-labelledby="user_drop">
                    <li><a href="#" class="dropdown-item nav-link"><i class="mdi mdi-home-variant-outline"></i> 我的主页</a>
                    </li>
                    <li></li><a href="/u/{{.UserData.UserId }}/settings" class="dropdown-item nav-link"><i
                            class="mdi mdi-cogs"></i> 用户设置</a></li>
                    <li> <a href="/loginout" class="dropdown-item nav-link"><i class="mdi mdi-logout"></i> 退出登录</a></li>
                </ul>
            </div>
            {{end}}
        </div>
    </div>
</header>

<div id="help"></div>


{{end}}
