{{define "passport/activateuser"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-10">
            <div class="card card-inverse {{if not .IsActivated }}card-danger{{else}}card-success{{end}} mb-3 my-5 text-center">
                <div class="card-body my-2">
                    <blockquote class="card-blockquote">
                        {{if not .IsActivated }}
                        激活失败，可能是激活码过期，请重新获取验证码！
                        {{else}}
                        感谢你激活账户，你可以正常使用中国日记网所有功能
                        {{end}}
                    </blockquote>
                </div>
            </div>
        </div>
    </div>
</div>

{{template "scripts" .}}
{{template "footer" .}}
{{end}}
