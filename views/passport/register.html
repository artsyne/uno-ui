{{define "passport/register"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="container">
    <div class="row justify-content-center my-5">
        <div class="col-md-6 py-5">
            <div class="card border-0 my-3">
                <div class="card-body my-2">
                    <form action="/register" id="biurenform" name="biurenform" method="post">
                        <div class="form-floating mb-5">
                            <input class="form-control" type="text" id="user_name" name="user_name"
                                valid="[{type:'limit',min:4,max:20},'validname']" placeholder="用户名" />
                            <label for="user_name">用户名</label>
                        </div>
                        <div class="form-floating mb-5">
                            <input class="form-control" type="password" id="pwd" name="pwd"
                                valid="[{type:'limit',min:6,max:30}]" placeholder="密码" />
                            <label for="pwd">密码</label>
                        </div>
                        <div class="form-floating mb-5">
                            <input class="form-control" type="text" id="email" name="email"
                                valid="['required','email']" placeholder="电子邮箱地址" />
                            <label for="email">电子邮箱地址</label>
                            <small class="text-muted p-1">
                                将往您注册E-mail发送一封激活邮件，请点击邮件中链接完成注册。如果激活邮件没有收到，请到垃圾邮箱找找
                            </small>
                        </div>
                        <div class="text-center">
                            <input type="hidden" name="time_zone" id="time_zone" />
                            <input type="hidden" name="lang" id="lang" />
                            <button class="btn btn-outline-secondary w-25 btn-lg" type="button" onclick="Biuren.Passport.reg()">免费注册
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center border-0 bg-body">
                    <a href="/login">已经有了账户？</a>
                </div>
            </div>
        </div>
    </div>
</div>


{{template "footer" .}}
{{end}}
