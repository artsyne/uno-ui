<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{.Subject}}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 5px;">
        <h2 style="color: #2c3e50;">{{.Greeting}}</h2>
        <p>{{.Body}}</p>
        <p>{{.RoleDesc}}</p>
        
        <div style="margin: 30px 0; text-align: center;">
            <a href="{{.AcceptLink}}" style="display: inline-block; padding: 12px 24px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">{{.ActionBtn}}</a>
        </div>
        
        <p style="font-size: 14px; color: #7f8c8d;">
            {{.AltLinkDesc}}<br>
            <a href="{{.AcceptLink}}" style="color: #3498db;">{{.AcceptLink}}</a>
        </p>
        
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        
        <p style="font-size: 12px; color: #95a5a6;">
            {{.IgnoreDesc}}
        </p>
    </div>
</body>
</html>
