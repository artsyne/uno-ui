<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简主题系统测试</title>
  <link rel="stylesheet" href="/dist/css/idiary.min.css">
  
  <script>
    // 极简主题预加载 - 防止闪烁
    (function() {
      try {
        const theme = localStorage.getItem('idiary-theme') || 'dark';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark'); // 默认暗黑模式
      }
    })();
  </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
  <div class="min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
      <header class="mb-8">
        <h1 class="text-3xl font-bold mb-4">极简主题系统测试</h1>
        <div class="flex gap-4">
          <button 
            data-theme-toggle 
            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 text-white rounded-lg transition-colors duration-200"
          >
            切换主题
          </button>
          <button 
            onclick="location.reload()" 
            class="px-4 py-2 bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white rounded-lg transition-colors duration-200"
          >
            刷新页面
          </button>
        </div>
      </header>

      <main>
        <section class="mb-8">
          <h2 class="text-2xl font-semibold mb-4">主题状态</h2>
          <div class="bg-gray-100 dark:bg-gray-800 p-4 rounded-lg">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <div>
                <strong>HTML Classes:</strong>
                <span id="html-classes" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span>
              </div>
              <div>
                <strong>当前主题:</strong>
                <span id="current-theme" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span>
              </div>
              <div>
                <strong>有效主题:</strong>
                <span id="effective-theme" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span>
              </div>
              <div>
                <strong>系统偏好:</strong>
                <span id="system-preference" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span>
              </div>
            </div>
          </div>
        </section>

        <section class="mb-8">
          <h2 class="text-2xl font-semibold mb-4">样式测试</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 表单控件 -->
            <div class="bg-gray-100 dark:bg-gray-800 p-4 rounded-lg">
              <h3 class="text-lg font-medium mb-3">表单控件</h3>
              <div class="space-y-3">
                <input 
                  type="text" 
                  placeholder="文本输入框" 
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                <select class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                  <option>选择选项</option>
                  <option>选项 1</option>
                  <option>选项 2</option>
                </select>
                <textarea 
                  placeholder="文本区域" 
                  rows="3" 
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                ></textarea>
              </div>
            </div>

            <!-- 按钮样式 -->
            <div class="bg-gray-100 dark:bg-gray-800 p-4 rounded-lg">
              <h3 class="text-lg font-medium mb-3">按钮样式</h3>
              <div class="space-y-3">
                <button class="w-full px-4 py-2 bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 text-white rounded-lg transition-colors duration-200">
                  主要按钮
                </button>
                <button class="w-full px-4 py-2 bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white rounded-lg transition-colors duration-200">
                  次要按钮
                </button>
                <button class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-600 rounded-lg transition-colors duration-200">
                  边框按钮
                </button>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2 class="text-2xl font-semibold mb-4">颜色测试</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-red-500 dark:bg-red-600 text-white p-4 rounded-lg text-center">
              红色
            </div>
            <div class="bg-green-500 dark:bg-green-600 text-white p-4 rounded-lg text-center">
              绿色
            </div>
            <div class="bg-blue-500 dark:bg-blue-600 text-white p-4 rounded-lg text-center">
              蓝色
            </div>
            <div class="bg-yellow-500 dark:bg-yellow-600 text-white p-4 rounded-lg text-center">
              黄色
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 加载新的极简主题系统 -->
  <script src="/src/js/theme.js?v=2.0.0"></script>
  
  <script>
    // 调试信息更新
    function updateDebugInfo() {
      const htmlClasses = document.documentElement.className || '(无)';
      const currentTheme = window.ThemeManager ? window.ThemeManager.getCurrentTheme() : '未加载';
      const effectiveTheme = window.ThemeManager ? window.ThemeManager.getEffectiveTheme() : '未加载';
      const systemPreference = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      
      document.getElementById('html-classes').textContent = htmlClasses;
      document.getElementById('current-theme').textContent = currentTheme;
      document.getElementById('effective-theme').textContent = effectiveTheme;
      document.getElementById('system-preference').textContent = systemPreference;
    }
    
    // 监听主题变化
    document.addEventListener('themechange', function(e) {
      console.log('主题已变化:', e.detail);
      updateDebugInfo();
    });
    
    // 页面加载完成后更新调试信息
    document.addEventListener('DOMContentLoaded', function() {
      updateDebugInfo();
      
      // 每秒更新一次调试信息
      setInterval(updateDebugInfo, 1000);
    });
    
    // 立即更新一次
    updateDebugInfo();
  </script>
</body>
</html>
