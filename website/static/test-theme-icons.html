<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>主题图标切换测试</title>
    <link href="/public/dist/css/idiary.min.css" rel="stylesheet">
    <link href="/public/dist/css/materialdesignicons.min.css?v=6.5.95" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0-beta.min.js"></script>
    <script src="/public/dist/js/kiko.min.js"></script>
    <script src="/public/src/js/theme.js?v=2.0.1"></script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-8 text-center">主题图标切换测试</h1>
        
        <!-- 模拟导航栏的主题切换按钮 -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">导航栏主题切换按钮</h2>
            <div class="flex items-center justify-center">
                <button data-theme-toggle class="mr-3 p-2 rounded-md bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors duration-200" title="切换主题">
                    <i class="mdi mdi-theme-light-dark text-gray-700 dark:text-gray-300 text-sm"></i>
                </button>
                <span class="text-sm text-gray-600 dark:text-gray-400">点击切换主题</span>
            </div>
        </div>
        
        <!-- 主题状态显示 -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">当前主题状态</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div>
                    <strong>存储主题:</strong> <span id="stored-theme">-</span>
                </div>
                <div>
                    <strong>有效主题:</strong> <span id="effective-theme">-</span>
                </div>
                <div>
                    <strong>HTML类:</strong> <span id="html-class">-</span>
                </div>
            </div>
        </div>
        
        <!-- 图标预览 -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">主题图标预览</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-center p-4 bg-white dark:bg-gray-700 rounded">
                    <i class="mdi mdi-weather-sunny text-4xl text-yellow-500 mb-2"></i>
                    <p class="text-sm">亮色主题图标</p>
                    <code class="text-xs">mdi-weather-sunny</code>
                </div>
                <div class="text-center p-4 bg-white dark:bg-gray-700 rounded">
                    <i class="mdi mdi-weather-night text-4xl text-blue-500 mb-2"></i>
                    <p class="text-sm">暗色主题图标</p>
                    <code class="text-xs">mdi-weather-night</code>
                </div>
                <div class="text-center p-4 bg-white dark:bg-gray-700 rounded">
                    <i class="mdi mdi-theme-light-dark text-4xl text-purple-500 mb-2"></i>
                    <p class="text-sm">系统主题图标</p>
                    <code class="text-xs">mdi-theme-light-dark</code>
                </div>
            </div>
        </div>
        
        <!-- 测试按钮 -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">手动测试</h2>
            <div class="flex flex-wrap gap-2">
                <button onclick="ThemeManager.setTheme('light')" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">
                    设置亮色主题
                </button>
                <button onclick="ThemeManager.setTheme('dark')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    设置暗色主题
                </button>
                <button onclick="ThemeManager.setTheme('system')" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">
                    设置系统主题
                </button>
                <button onclick="updateDebugInfo()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                    刷新状态
                </button>
            </div>
        </div>
        
        <!-- 键盘快捷键提示 -->
        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg">
            <h2 class="text-xl font-semibold mb-4">键盘快捷键</h2>
            <p class="text-sm text-gray-600 dark:text-gray-400">
                按 <kbd class="px-2 py-1 bg-gray-200 dark:bg-gray-600 rounded text-xs">Ctrl/Cmd + Shift + T</kbd> 快速切换主题
            </p>
        </div>
    </div>
    
    <script>
        // 更新调试信息
        function updateDebugInfo() {
            if (typeof ThemeManager !== 'undefined') {
                document.getElementById('stored-theme').textContent = ThemeManager.getCurrentTheme();
                document.getElementById('effective-theme').textContent = ThemeManager.getEffectiveTheme();
                document.getElementById('html-class').textContent = document.documentElement.className || '(无)';
            }
        }
        
        // 监听主题变化事件
        document.addEventListener('themechange', function(e) {
            console.log('主题已切换:', e.detail);
            updateDebugInfo();
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo();
            
            // 每秒更新一次状态（用于调试）
            setInterval(updateDebugInfo, 1000);
        });
    </script>
</body>
</html>
