{{define "member/list"}}
<div id="diary-notebook-container">
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8" id="daybook_list">
        {{ $timeZone := .Data.TimeZone }}
        {{ $lang := .Context.Lang }}
        {{ range .Data.Diaries }}
        {{ template "member/diary_card" dict "Diary" . "Lang" $lang "TimeZone" $timeZone }}
        {{ end }}
    </div>

    {{ if gt .Data.DiariesNum .Data.PageSize }}
    <div class="flex justify-center mt-10" hx-boost="true" hx-target="#diary-notebook-container" hx-swap="outerHTML">
        {{ template "pagination" . }}
    </div>
    {{ end }}
</div>
{{end}}
