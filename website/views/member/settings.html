{{define "member/settings"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <!-- 导航路径 -->
    <section class="mb-10">
        <div id="page-nav">
            <ul class="flex text-lg">
                <li>
                    <a href="/u/{{getUserID .}}">{{getUserName .}}</a>
                </li>
                <li class="mx-2">
                    <span class="mdi mdi-slash-forward"></span>
                </li>
                <li>
                    <a href="#">Settings</a>
                </li>
            </ul>
        </div>
    </section>

    <section class="mx-auto lg:w-2/3">
        <!-- Profile Card -->
        <div class="mb-8">
            <div class="card-title">Profile</div>
            <form id="profile-form">
                <div>
                    <!-- Avatar -->
                    <div class="my-10 text-center">
                        <div class="avatar-lg">
                            {{getFirstCharOfName .}}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-title" >User Name</label>
                        <input type="text" class="form-control" id="user_name" name="user_name" placeholder="User Name"
                            value="{{.Data.User.UserName}}"
                            readonly
                          />
                        <p class="form-info">
                            用户名是您在 idiary.ai 的唯一标识，不能修改。
                        </p>
                    </div>

                    <!-- Full name -->
                    <div class="mb-4">
                        <label class="form-title" for="full_name">Full name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Full name"
                            valid='[{"type":"required"},{"type":"limit","max":50}]' value="{{.Data.User.FullName}}"
                            data-original-value="{{.Data.User.FullName}}" />
                        <p class="form-info">
                            您可以在 idiary.ai 上展示您的真实姓名，如果为空则显示用户名。
                        </p>
                    </div>

                    <!-- Bio -->
                    <div class="mb-4">
                        <label class="form-title" for="remark">Bio</label>
                        <textarea class="form-control" id="remark" name="remark" 
                            valid='[{"type":"limit","max":250,"show":true}]' style="height: 120px;">{{.Data.User.Remark}}</textarea>
                    </div>

                    <!-- Save buttons -->
                    <div class="flex justify-end mt-6">
                        <button type="submit" class="btn-red" data-action="save-profile">Save changes</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Email Card -->
        <div class="mb-8">
            <div class="card-title">Email</div>
            <form id="email-form">
                <div>
                    <div class="mb-4">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                            valid='[{"type":"required"},{"type":"email"}]' value="{{.Data.User.Email}}"
                            data-original-value="{{.Data.User.Email}}">
                    </div>

                    <!-- Save buttons -->
                    <div class="flex justify-end mt-6">
                        <button type="submit" class="btn-red" data-action="save-email">Save changes</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Password Card -->
        <div>
            <div class="card-title">Update password</div>
            <form id="password-form">
                <div>
                    <!-- Current password -->
                    <div class="mb-4">
                        <label class="form-title" for="current_pwd">Current password</label>
                        <input type="password" class="form-control" id="current_pwd" name="current_pwd"
                            placeholder="Current password" valid='[{"type":"required"},{"type":"limit","min":6,"max":30}]'>
                    </div>

                    <!-- New password -->
                    <div class="mb-4">
                        <label class="form-title" for="new_pwd">New password</label>
                        <input type="password" class="form-control" id="new_pwd" name="new_pwd"
                            placeholder="New password" valid='[{"type":"required"},{"type":"limit","min":6,"max":30}]'>
                    </div>

                    <!-- Confirm password -->
                    <div class="mb-4">
                        <label class="form-title" for="confirm_pwd">Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_pwd" name="confirm_pwd"
                            placeholder="Confirm new password"
                            valid='[{"type":"required"},{"type":"compareto","destid":"new_pwd"}]'>
                    </div>

                    <!-- Change password button -->
                    <div class="flex justify-end mt-6">
                        <button type="submit" class="btn-red" data-action="change-password">Change password</button>
                    </div>                </div>
            </form>
        </div>
    </section>
</main>

{{template "footer" .}}
{{end}}
