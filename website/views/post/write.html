{{define "post/write"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">

    <section class="flex justify-between mb-10">
        <div id="page-nav">
            <ul class="flex text-black text-lg">
                <li>
                    <a href="/u/{{.UserData.UserId}}">{{.UserData.UserName}}</a><span
                        class="mdi mdi-slash-forward mx-3"></span>
                </li>
                <li>
                    <a href="#">写日记</a>
                    <span class="mdi mdi-square-small mx-3"></span>
                    <a class="nav-link" href="#">草稿箱</a>
                    <span class="mdi mdi-square-small  mx-3"></span>
                    <a class="nav-link" href="#">回收站</a>
                </li>
            </ul>
        </div>
    </section>

    <section>
        <form id="diary_editor_form">
            <div class="row col-md-8 offset-md-2 p-5">
                <div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="info_title" name="info_title"
                            placeholder="标题(非必填)">
                        <label for="info_title">标题(非必填)</label>
                    </div>
                    <div class="form-floating mb-3">
                        <select class="form-select" id="diary_id" name="diary_id">
                            {{range .Diaries}}
                            <option value="{{.DiaryID}}">{{.Title}}</option>
                            {{end}}
                        </select>
                        <label for="info_title">日记本</label>
                    </div>
                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="info_body" name="info_body" rows="8" placeholder="日记内容"
                            style="height: 300px;"></textarea>
                        <label for="info_body">日记内容</label>
                    </div>
                </div>
                <div>
                    <button type="button" class="ms-auto btn btn-outline-secondary px-5 mx-5"
                        onclick="Biuren.Diary.postInfo()">发布</button>
                    <button type="button" class="ms-auto btn btn-outline-secondary"
                        onclick="Biuren.Diary.postInfo()">保存草稿</button>
                </div>
            </div>
        </form>
    </section>

</main>

{{template "footer" .}}
{{end}}
