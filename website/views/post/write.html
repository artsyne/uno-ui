{{define "post/write"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">

    <section class="flex justify-between mb-10">
        <div id="page-nav">
            <ul class="flex text-black text-lg">
                <li>
                    <a href="/u/{{.UserData.UserId}}">{{.UserData.UserName}}</a><span
                        class="mdi mdi-slash-forward mx-3"></span>
                </li>
                <li>
                    <a href="#">写日记</a>
                    <span class="mdi mdi-square-small mx-3"></span>
                    <a class="nav-link" href="#">草稿箱</a>
                    <span class="mdi mdi-square-small  mx-3"></span>
                    <a class="nav-link" href="#">回收站</a>
                </li>
            </ul>
        </div>
    </section>

    <section>
        <form id="diary_editor_form">
            <div class="flex flex-col mx-auto lg:w-4/5">
                <div class="form-group">
                    <div class="block">
                        <label class="form-title" for="info_title">标题(非必填)</label>
                        <input type="text" class="form-control" id="info_title" name="info_title">
                    </div>
                    <div class="block">
                        <label class="form-title" for="info_title">日记本</label>
                        <select class="form-control" id="diary_id" name="diary_id">
                            {{range .Diaries}}
                            <option value="{{.DiaryID}}">{{.Title}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="block">
                        <label class="form-title" for="info_body">日记内容</label>
                        <textarea class="form-control h-80" id="info_body" name="info_body" rows="8"></textarea>
                    </div>
                    <div class="block">
                        <button type="button" class="btn-red px-10 me-10"
                           id="post_btn">发布</button>
                        <button type="button" class="btn"
                            onclick="Biuren.Diary.postInfo()">保存草稿</button>
                    </div>
                </div>
            </div>
        </form>
    </section>

</main>

{{template "footer" .}}
{{end}}
