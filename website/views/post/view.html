{{define "post/view"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main dt{{.Data.Diary.ThemeID}}">
    <!-- 面包屑导航 -->
    <section class="flex justify-between mb-10">
        <div id="page-nav">
            <ul class="flex text-lg text-gray-700 dark:text-gray-300">
                <li><a href="/u/{{.Data.Post.AddUserID}}">{{.Data.Post.AddUserName}}</a>
                    <i class="mdi mdi-slash-forward mx-3 text-gray-500 dark:text-gray-400"></i>
                </li>
                <li>
                    <a href="/d/{{.Data.Post.DiaryID}}">{{.Data.Diary.Title}}</a>
                </li>
            </ul>
        </div>
    </section>

   {{template "post/detail" .}}
</main>
{{template "footer" .}}
{{end}}
