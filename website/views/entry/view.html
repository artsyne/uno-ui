{{define "entry/view"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main dt{{.Data.Diary.ThemeID}}" data-social-setting="{{.Data.Diary.SocialSetting}}">
    <!-- 面包屑导航 -->
    <section class="mb-10">
        <div id="page-nav">
            <ul class="flex text-lg">
                <li>
                    <a href="/u/{{.Data.Entry.AddUserID}}">{{ showUserName .Data.Entry }}</a>
                </li>
                <li class="mx-2">
                    <span class="mdi mdi-slash-forward"></span>
                </li>
                <li>
                    <a href="/diary/{{.Data.Entry.DiaryID}}">{{.Data.Diary.Title}}</a>
                </li>
            </ul>
        </div>
    </section>

    <div id="entry-detail-container-outer" class="container entry-container mx-auto dt{{.Data.Diary.ThemeID}}">
        {{template "entry/detail" .}}
    </div>
</main>
{{template "footer" .}}
{{end}}
