{{define "entry/view"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main dt{{.Data.Diary.ThemeID}}" data-social-setting="{{.Data.Diary.SocialSetting}}">
    <!-- 面包屑导航 -->
    <section class="flex justify-between mb-10">
        <div id="page-nav">
            <ul class="flex text-lg text-gray-700 dark:text-gray-300">
                <li><a href="/u/{{.Data.Entry.AddUserID}}">{{.Data.Entry.AddUserName}}</a>
                    <i class="mdi mdi-slash-forward mx-3 text-gray-500 dark:text-gray-400"></i>
                </li>
                <li>
                    <a href="/diary/{{.Data.Entry.DiaryID}}">{{.Data.Diary.Title}}</a>
                </li>
            </ul>
        </div>
    </section>

    <div id="entry-detail-container-outer" class="container entry-container mx-auto dt{{.Data.Diary.ThemeID}}">
        {{template "entry/detail" .}}
    </div>
</main>
{{template "footer" .}}
{{end}}
