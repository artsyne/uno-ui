{{define "error"}}
<div class="flex flex-col items-center justify-center min-h-[60vh] px-4 text-center">
    <div class="mb-6 text-gray-400 dark:text-gray-500">
        <i class="mdi mdi-alert-circle-outline text-6xl"></i>
    </div>
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-2">
        {{if .Data.Title}}{{.Data.Title}}{{else}}{{getMessage "error.title" .Context.Lang}}{{end}}
    </h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md">
        {{if .Data.Message}}{{.Data.Message}}{{else}}{{getMessage "error.message" .Context.Lang}}{{end}}
    </p>
    <a href="/"
        class="px-6 py-2 bg-black text-white dark:bg-white dark:text-black rounded hover:opacity-80 transition-opacity">
        {{getMessage "common.back_home" .Context.Lang}}
    </a>
</div>
{{end}}
