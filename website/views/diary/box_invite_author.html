{{define "diary/box_invite_author"}}
<div class="w-full">
    <form id="inviteAuthorForm" hx-post="/diary/{{.DiaryID}}/authors" hx-trigger="submit" hx-target="this"
        hx-swap="none" x-data="{ inviteeIdentity: '' }" x-uno-valid>
        <div class="form-mask">
            <div class="loading-spinner"></div>
        </div>

        <div class="mb-4">
            <div class="relative">
                <input type="text" id="invitee_identity" name="invitee_identity" x-model="inviteeIdentity"
                    x-uno-valid="['required', {type: 'length', min: 3}]"
                    class="form-control"
                    placeholder="{{getMessage "diary.author.identity_placeholder" .Lang}}">
            </div>
            <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">
                {{getMessage "diary.author.invite_note" .Lang}}
            </p>
        </div>
    </form>
</div>
{{end}}
