{{define "navbar"}}

<header class="fixed top-0 left-0 right-0 z-30 mx-auto bg-slate-100">
    <nav class="px-5 py-3 mx-auto flex justify-between">
        <div class="tracking-wide text-xl text-neutral-600 flex items-center">
            <a href="/">
                i<span class="text-red-600">D</span>iary.ai
            </a>
        </div>
        <div id="top-nav" class="text-base/loose flex items-center">
        </div>
        <div class="text-base/loose">
            {{if not .IsLogin }}
            <a class="nav-link text-black-50 fs-6" href="/register" role="button"><i class="fa fa-id-card-o"></i>
                免费注册</a>
            <a class="nav-link text-black-50 fs-6" href="/login" role="button"><i class="fa fa-sign-in"></i> 登录</a>
            {{else}}
            <div class="flex items-center space-x-3">
                <div>
                    <a id="user_drop" href="#" class="text-gray-500 p-0" data-tooltip-target="user_menu"
                        data-tooltip-position="bottom" data-tooltip-event="click,mouseover">
                        <img class="w-10 h-10 rounded-full" src="{{.Data.AuthUser.FaceUrl}}" />
                    </a>
                    <div id="user_menu" class="bg-white border border-gray-200 p-3" style="display:none;">
                        <ul>
                            <li><a href="/u/{{.Data.AuthUser.UserId }}"
                                    class="block px-3 py-2 text-gray-700 hover:bg-gray-100"><i
                                        class="mdi mdi-home-variant-outline"></i> 我的主页</a></li>
                            <li><a href="/u/{{.Data.AuthUser.UserId }}/settings"
                                    class="block px-3 py-2 text-gray-700 hover:bg-gray-100"><i class="mdi mdi-cogs"></i>
                                    用户设置</a></li>
                            <li><a href="/loginout" class="block px-3 py-2 text-gray-700 hover:bg-gray-100"><i
                                        class="mdi mdi-logout"></i> 退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </nav>
</header>

<div id="help"></div>

{{end}}
