{{define "navbar"}}

<header x-data="navbar"
    class="fixed top-0 left-0 right-0 z-30 mx-auto bg-slate-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 transition-colors duration-200">
    <nav class="px-5 py-3 mx-auto flex justify-between items-center">
        <div class="tracking-wide text-xl text-neutral-600 dark:text-neutral-300 flex items-center">
            <a href="/index">
                i<span class="text-red-600">D</span>iary.ai
            </a>
        </div>

        <div class="text-base/loose flex items-center">
            <div class="flex items-center space-x-3">
                <!-- 语言切换按钮 -->
                <button id="lang_switch" class="mr-6 cursor-pointer" x-uno-tooltip="{
                        content: '#lang_menu_content',
                        theme: $store.theme.on ? 'dark' : 'light',
                        trigger: 'click',
                        placement: 'bottom'
                    }">
                    <i class="mdi mdi-translate text-gray-700 dark:text-gray-300 text-sm"></i>
                </button>
                <template id="lang_menu_content">
                    <div class="grid grid-cols-2 gap-1 min-w-[250px]">

                        <a href="#" @click.prevent="$store.i18n.set('en')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'en' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">EN</span> English</a>
                        <a href="#" @click.prevent="$store.i18n.set('fr')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'fr' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">FR</span> Français</a>
                        <a href="#" @click.prevent="$store.i18n.set('ja')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'ja' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">JA</span> 日本語</a>
                        <a href="#" @click.prevent="$store.i18n.set('ko')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'ko' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">KO</span> 한국어</a>
                        <a href="#" @click.prevent="$store.i18n.set('zh-cn')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'zh-cn' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">CN</span> 简体中文</a>
                        <a href="#" @click.prevent="$store.i18n.set('zh-tw')" class="tooltip-link rounded"
                            :class="{ 'bg-gray-100 dark:bg-gray-700': $store.i18n.current === 'zh-tw' }">
                            <span class="mr-2 text-gray-400 dark:text-gray-300">TW</span> 繁體中文</a>
                    </div>
                </template>

                <!-- 主题切换按钮 -->
                <button @click="$store.theme.toggle()" class="mr-6 cursor-pointer"
                    title='{{getMessage "common.theme_switch" .Context.Lang}}'>
                    <i class="mdi text-sm"
                        :class="$store.theme.on ? 'mdi-weather-night text-gray-300' : 'mdi-weather-sunny text-gray-700'"></i>
                </button>

                {{if not (isLogin .)}}
                
                <a class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors duration-200 mr-4"
                    href="/register" role="button">
                    {{getMessage "auth.button.register_free" .Context.Lang}}</a>
                <a class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors duration-200"
                    href="/login" role="button">{{getMessage "auth.button.login"
                    .Context.Lang}}</a>

                {{else}}
                <a id="user_drop" href="#" class="text-gray-500 dark:text-gray-400 p-0" x-uno-tooltip="{
                        content: '#user_menu_content',
                        theme: $store.theme.on ? 'dark' : 'light',
                        trigger: 'click',
                        placement: 'bottom'
                    }">
                    <div class="avatar">
                        {{getFirstCharOfName .}}
                    </div>
                </a>
                <template id="user_menu_content">
                    <ul class="min-w-[160px] py-1">
                        <li><a href="/u/{{getUserID .}}" class="tooltip-link"><i
                                    class="mdi mdi-home-variant-outline mr-2"></i> {{getMessage "user.label.my_home"
                                .Context.Lang}}</a></li>
                        <li><a href="/u/settings" class="tooltip-link"><i class="mdi mdi-cogs mr-2"></i>
                                {{getMessage "user.label.settings" .Context.Lang}}</a></li>
                        <li><a href="/loginout" class="tooltip-link"><i class="mdi mdi-logout mr-2"></i> {{getMessage
                                "auth.button.logout" .Context.Lang}}</a></li>
                    </ul>
                </template>
                {{end}}
            </div>

        </div>
    </nav>
</header>

<div id="help"></div>

{{end}}
