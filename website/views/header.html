{{define "header"}}
<!DOCTYPE html>
<html lang="{{.Context.Lang}}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="{{.Description}}">
	<meta name="author" content="">
	<link rel="icon" href="/public/favicon.ico?v=7">
	<title>{{.Title}}</title>
	<meta name="user-id" content="{{ getUserID .}}">
	<meta name="user-name" content="{{ showUserName . }}">
	<meta name="csrf-token" content="{{.Context.CsrfToken}}">
	<link href="/public/dist/css/idiary.min.css?v={{getRandomVersion .}}" rel="stylesheet">
	<link href="/public/dist/css/materialdesignicons.min.css?v=6.5.95" rel="stylesheet">
	<script>
		(function () { const t = document.cookie.match(/[; ]?idiary-theme=([^;]*)/); const h = t ? t[1] : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.classList.toggle('dark', h === 'dark'); })();
	</script>
</head>

<body class="bg-white dark:bg-gray-900 transition-colors duration-200">
	<div id="app" class="flex flex-col mt-14 text-zinc-500 bg-white dark:bg-gray-900 transition-colors duration-200">
		{{end}}
