{{define "header"}}
<!DOCTYPE html>
<html lang="{{.Context.Lang}}" class="dark">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="{{.Description}}">
	<meta name="author" content="">
	<link rel="icon" href="/public/favicon.ico?v=7">
	<title>{{.Title}}</title>

	<meta name="user-id" content="{{ getUserID .}}">
	<meta name="user-name" content="{{getUserName .}}">

	<link href="/public/dist/css/idiary.min.css?v={{getRandomVersion .}}" rel="stylesheet">

	<!-- Modern Stack: HTMX, Alpine, Uno -->
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<!-- Load Uno BEFORE Alpine to ensure event listeners are registered -->
	<script defer src="/public/dist/js/uno.umd.js?v={{getRandomVersion .}}"></script>
	<!-- Bundle must be loaded AFTER Uno to allow Store extending -->
	<script defer src="/public/dist/js/bundle.js?v={{getRandomVersion .}}"></script>
	<script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>


	<link href="/public/dist/css/materialdesignicons.min.css?v=6.5.95" rel="stylesheet">
</head>

<body class="bg-white dark:bg-gray-900 transition-colors duration-200">
	<div id="app" class="flex flex-col mt-14 text-zinc-500 bg-white dark:bg-gray-900 transition-colors duration-200">
		{{end}}
