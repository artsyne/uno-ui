{{define "header"}}
<!DOCTYPE html>
<html lang="zh_cn">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">
	<link rel="icon" href="/public/favicon.ico?v=7">
	<title>{{.Title}} - iDiary</title>
	<script src="https://code.jquery.com/jquery-4.0.0-beta.min.js"></script>
	<!--
	<script src="/public/dist/js/idiary.min.js?v=0.28"></script>
	<link href="/public/dist/css/idiary.min.css?v=1.14" rel="stylesheet">
	-->
	<script>
		//发布时去掉
		// 动态生成时间戳
		var timestamp = new Date().getTime();

		// 动态加载 JavaScript 文件
		var script = document.createElement('script');
		script.src = '/public/dist/js/idiary.min.js?v=' + timestamp;
		document.head.appendChild(script);

		// 动态加载 CSS 文件
		var link = document.createElement('link');
		link.rel = 'stylesheet';
		link.href = '/public/dist/css/idiary.min.css?v=' + timestamp;
		document.head.appendChild(link);
	</script>

	<script src="https://cdn.tailwindcss.com"></script>
	<link href="/public/dist/css/materialdesignicons.min.css?v=6.5.95" rel="stylesheet">
	{{if .IsLogin }}
	<script>
		var login_user_name = '{{.UserData.UserName}}'; var login_user_id = {{.UserData.UserId }};
	</script>
	{{end}}
</head>

<body>
	<div id="app" class="flex flex-col mt-14 text-zinc-500">
		{{end}}
