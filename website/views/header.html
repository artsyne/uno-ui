{{define "header"}}
<!DOCTYPE html>
<html lang="zh_cn">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">
	<link rel="icon" href="/public/favicon.ico?v=7">
	<title>{{.Title}} - iDiary</title>
	<script src="https://code.jquery.com/jquery-4.0.0-beta.min.js"></script>
	<script>
		// 动态加载JavaScript文件
		(function () {
			var version = new Date().getTime();

			// 加载 kiko ui 框架
			var script = document.createElement('script');
			script.src = '/public/dist/js/kiko.min.js?v=' + version;
			script.async = false; // 确保脚本按顺序加载
			document.head.appendChild(script);

			// 动态创建并添加脚本标签
			var script = document.createElement('script');
			script.src = '/public/dist/js/idiary.min.js?v=' + version;
			script.async = false; // 确保脚本按顺序加载
			document.head.appendChild(script);

			// 记录加载信息
			console.log('[iDiary] 加载脚本: ' + script.src);
		})();
	</script>
	<link href="/public/dist/css/idiary.min.css?v=1.15" rel="stylesheet">
	<link href="/public/dist/css/materialdesignicons.min.css?v=6.5.95" rel="stylesheet">
	{{if .IsLogin }}
	<script>
		var login_user_name = '{{.UserData.UserName}}';
		var login_user_id = {{.UserData.UserId }};
	</script>
	{{end}}
</head>

<body>
	<div id="app" class="flex flex-col mt-14 text-zinc-500">
		{{end}}
