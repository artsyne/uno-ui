{{define "passport/findpwd"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <div id="findpwd-container">
            <form hx-post="/findpwd" hx-target="#findpwd-container" hx-swap="innerHTML" x-data="validForm"
                @submit.prevent="submit" hx-trigger="valid-submit">
                <div class="flex flex-col my-20 mx-auto lg:w-2/5">
                    <div class="form-group">
                        <h1 class="form-header">{{getMessage "auth.title.find_password" .Context.Lang}}</h1>
                        <div id="error-message"></div>
                        <div class="block">
                            <label class="form-title">{{getMessage "auth.label.register_email" .Context.Lang}}</label>
                            <input class="form-control" type="email" id="email" name="email" x-validate
                                valid='["required","email"]' />
                            <div x-valid-error="email"></div>
                            <p class="form-info">{{getMessage "auth.message.reset_email_note" .Context.Lang}}
                            </p>
                        </div>
                        <div class="block">
                            <button class="w-full btn" type="submit">{{getMessage "auth.button.find_password"
                                .Context.Lang}}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>
</main>

{{template "footer" .}}
{{end}}
