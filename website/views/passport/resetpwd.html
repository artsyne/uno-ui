{{define "passport/resetpwd"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="container">
    <div class="row justify-content-center my-5">
        <div class="col-md-6 py-5">
            <div class="card border-0 my-3">
                <div class="card-body my-2">
                    {{if .Data.IsRightCode }}
                    <form action="/resetpwd" method="post">
                        <div class="form-floating mb-5">
                            <input class="form-control" type="password" id="new_pwd" name="new_pwd"
                                placeholder="{{getMessage "auth.label.new_password" .Context.Lang}}" valid='[{"type":"limit","min":6,"max":30}]' />
                            <label for="new_pwd">{{getMessage "auth.label.new_password" .Context.Lang}}</label>
                        </div>
                        <div class="form-floating mb-5">
                            <input class="form-control" type="password" id="confirm_pwd" name="confirm_pwd"
                                placeholder="{{getMessage "auth.label.confirm_password" .Context.Lang}}"
                                valid='[{"type":"compareto","destid":"new_pwd","msg":"{{getMessage "auth.message.password_mismatch" .Context.Lang}}"}]' />
                            <label for="confirem_pwd">{{getMessage "auth.label.confirm_password" .Context.Lang}}</label>
                        </div>
                        <div class="text-center">
                            <button class="btn btn-outline-secondary w-25 btn-lg" type="submit">{{getMessage "auth.button.reset_password" .Context.Lang}}
                            </button>
                            <input type="hidden" name="uid" value="{{.Data.UID}}" />
                            <input type="hidden" name="sign" value="{{.Data.Sign}}" />
                        </div>
                    </form>
                    {{else}}
                    <p>{{getMessage "auth.message.verification_expired" .Context.Lang}}</p>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>

{{template "footer" .}}
{{end}}
