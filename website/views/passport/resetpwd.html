{{define "passport/resetpwd"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <div id="resetpwd-container" class="flex flex-col my-20 mx-auto lg:w-2/5">
            {{if .Data.IsRightCode }}
            <form class="relative" hx-post="/resetpwd" hx-target="#resetpwd-container" hx-swap="innerHTML" x-data x-uno-valid novalidate>
                <div class="form-group">
                    <h1 class="form-header">{{getMessage "auth.button.reset_password" .Context.Lang}}</h1>
                    <div class="error-message hidden my-2"></div>

                    <div class="block">
                        <label class="form-title" for="new_pwd">{{getMessage "auth.label.new_password"
                            .Context.Lang}}</label>
                        <input class="form-control" type="password" id="new_pwd" name="new_pwd"
                            placeholder="{{getMessage " auth.label.new_password" .Context.Lang}}"
                            x-uno-valid="['required', 'pwd']" />
                    </div>

                    <div class="block">
                        <label class="form-title" for="confirm_pwd">{{getMessage "auth.label.confirm_password"
                            .Context.Lang}}</label>
                        <input class="form-control" type="password" id="confirm_pwd" name="confirm_pwd"
                            placeholder="{{getMessage " auth.label.confirm_password" .Context.Lang}}" x-uno-valid="[
                                'required', 
                                { type: 'match', target: '#new_pwd' } ]" />
                    </div>

                    <div class="block">
                        <button class="w-full btn" type="submit">{{getMessage "auth.button.reset_password"
                            .Context.Lang}}
                        </button>
                        <input type="hidden" name="uid" value="{{.Data.UID}}" />
                        <input type="hidden" name="sign" value="{{.Data.Sign}}" />
                    </div>
                </div>
            </form>
            {{else}}
            <div class="text-center">
                <p class="text-lg text-red-500">{{getMessage "auth.message.verification_expired" .Context.Lang}}</p>
            </div>
            {{end}}
        </div>
    </section>
</main>

{{template "footer" .}}
{{end}}
