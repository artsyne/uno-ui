{{define "passport/register"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <form class="relative" hx-post="/register" hx-target="#register-error" hx-swap="innerHTML" x-uno-valid novalidate>
            <div class="form-mask">
                <div class="loading-spinner"></div>
            </div>
            <div class="mx-auto my-20 flex flex-col lg:w-2/5">
                <div class="form-group">
                    <h1 class="form-header">{{getMessage "auth.title.register" .Context.Lang}}</h1>
                    <div id="register-error" class="error-message hidden my-2"></div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.username" .Context.Lang}}</label>
                        <input class="form-control" type="text" id="handle" name="handle" x-uno-valid="[
                               'required','validname',
                                { type: 'validator', name: 'checkHandle', debounce: 500 }
                            ]" />
                    </div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.password" .Context.Lang}}</label>
                        <input class="form-control" type="password" id="pwd" name="pwd"
                            x-uno-valid="['required','pwd']" />
                    </div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.email_address" .Context.Lang}}</label>
                        <input class="form-control" type="email" id="email" name="email" x-uno-valid="[
                               'required','email',
                                { type: 'validator', name: 'checkEmail', debounce: 500 }
                            ]" />
                        <p class="form-info">
                            {{getMessage "auth.message.activation_email_note" .Context.Lang}}
                        </p>
                    </div>
                    <input type="hidden" name="time_zone" x-data
                        x-init="$el.value = Intl.DateTimeFormat().resolvedOptions().timeZone">
                    <div class="block text-center">
                        <button class="w-full btn" type="submit">{{getMessage
                            "auth.button.register_free" .Context.Lang}}
                        </button>
                    </div>
                    <div class="block text-center">
                        <a href="/login">{{getMessage "auth.link.already_have_account" .Context.Lang}}</a>
                    </div>
                </div>
            </div>
        </form>
    </section>
</main>

{{template "footer" .}}
{{end}}
