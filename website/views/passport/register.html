{{define "passport/register"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <form hx-post="/register" hx-target="#register-error" hx-swap="innerHTML" x-data="validForm"
            @submit.prevent="submit" hx-trigger="valid-submit">
            <div class="mx-auto my-20 flex flex-col lg:w-2/5">
                <div class="form-group">
                    <h1 class="form-header">{{getMessage "auth.title.register" .Context.Lang}}</h1>
                    <div id="register-error"></div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.username" .Context.Lang}}</label>
                        <input class="form-control" type="text" id="user_name" name="user_name" x-validate
                            valid='[{"type":"required"},{"type":"validname"},{"type":"callback","fn":"checkUsername","msg":"{{getMessage "auth.message.username_taken" .Context.Lang}}"}]' />
                        <div x-valid-error="user_name"></div>
                    </div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.password" .Context.Lang}}</label>
                        <input class="form-control" type="password" id="pwd" name="pwd" x-validate
                            valid='[{"type":"limit","min":6,"max":30}]' />
                        <div x-valid-error="pwd"></div>
                    </div>
                    <div class="block">
                        <label class="form-title">{{getMessage "auth.label.email_address" .Context.Lang}}</label>
                        <input class="form-control" type="text" id="email" name="email" x-validate
                            valid='[{"type":"required"},{"type":"email"},{"type":"callback","fn":"checkEmail","msg":"{{getMessage "auth.message.email_taken" .Context.Lang}}"}]' />
                        <div x-valid-error="email"></div>
                        <p class="form-info">
                            {{getMessage "auth.message.activation_email_note" .Context.Lang}}
                        </p>
                    </div>
                    <div class="block text-center">
                        <button class="w-full btn" type="submit">{{getMessage
                            "auth.button.register_free" .Context.Lang}}
                        </button>
                    </div>
                    <div class="block text-center">
                        <a href="/login">{{getMessage "auth.link.already_have_account" .Context.Lang}}</a>
                    </div>
                </div>
            </div>
        </form>
    </section>
</main>

{{template "footer" .}}
{{end}}
