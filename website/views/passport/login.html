{{define "passport/login"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <form action="/login" method="post" name="biurenform" id="biurenform">
            <div class="flex flex-col my-20 mx-auto lg:w-2/5">
                <div class="form-group">
                    <h1 class="form-header">Welcome.</h1>
                    <div class="block">
                        <label for="login_name" class="form-title">用户名或邮箱</label>
                        <input type="text" class="form-control" id="login_name" name="login_name"
                            valid="[{type:'limit',min:4,max:20},'validname']" />
                    </div>
                    <div class="block">
                        <label for="pwd" class="form-title">密码</label>
                        <input type="password" class="form-control" id="pwd" name="pwd"
                            valid="[{type:'limit',min:6,max:30}]" />
                    </div>
                    <div class="block text-center">
                        <button class="w-full btn-red" type="button" onclick="Biuren.Passport.login()">登录
                        </button>
                    </div>
                    <div class="flex justify-between">
                        <div class="">
                            <a href="/findpwd"><span class="mdi mdi-key-outline"></span> 忘记密码？</a>
                        </div>
                        <div class="">
                            <a href="/register">免费注册 <span class="mdi mdi-account-plus-outline"></span></a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>
</main>

{{template "footer" .}}
{{end}}
