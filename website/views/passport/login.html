{{define "passport/login"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main">
    <section>
        <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" x-data="validForm" @submit.prevent="submit"
            hx-trigger="valid-submit">
            <div class="flex flex-col my-20 mx-auto lg:w-2/5">
                <div class="form-group">
                    <h1 class="form-header">{{getMessage "auth.title.login" .Context.Lang}}</h1>
                    <div id="login-error"></div>
                    <div class="block">
                        <label for="login_name" class="form-title">{{getMessage "auth.label.username_or_email"
                            .Context.Lang}}</label>
                        <input type="text" class="form-control" id="login_name" name="login_name" x-validate
                            valid='["required"]' />
                        <div x-valid-error="login_name"></div>
                    </div>
                    <div class="block">
                        <label for="pwd" class="form-title">{{getMessage "auth.label.password" .Context.Lang}}</label>
                        <input type="password" class="form-control" id="pwd" name="pwd" x-validate valid='["required"]' />
                        <div x-valid-error="pwd"></div>
                    </div>
                    <div class="block text-center">
                        <button class="w-full btn" type="submit">{{getMessage "auth.button.login" .Context.Lang}}
                        </button>
                    </div>
                    <div class="flex justify-between">
                        <div class="">
                            <a href="/findpwd"><span class="mdi mdi-key-outline"></span> {{getMessage
                                "auth.link.forgot_password" .Context.Lang}}</a>
                        </div>
                        <div class="">
                            <a href="/register">{{getMessage "auth.button.register_free" .Context.Lang}} <span
                                    class="mdi mdi-account-plus-outline"></span></a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>
</main>

{{template "footer" .}}
{{end}}
