{{define "passport/activateuser"}}
{{template "header" .}}
{{template "navbar" .}}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-10">
            <div
                class="card card-inverse {{if not .Data.IsActivated }}card-danger{{else}}card-success{{end}} mb-3 my-5 text-center">
                <div class="card-body my-2">
                    <blockquote class="card-blockquote">
                        {{if not .Data.IsActivated }}
                        {{getMessage "auth.message.activation_failed" .Context.Lang}}
                        {{else}}
                        {{getMessage "auth.message.activation_success" .Context.Lang}}
                        {{end}}
                    </blockquote>
                </div>
            </div>
        </div>
    </div>
</div>


{{template "footer" .}}
{{end}}
