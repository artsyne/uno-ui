{{define "pagination"}}
<div class="flex space-x-2">
    {{range .Data.PageLinks}}
        {{if eq .Text "dots"}}
        <a class="py-2 px-3" href="javascript:void(0)"><span class="mdi mdi-dots-horizontal"></span></a>
        {{else}}
                {{if .IsCurrentPage}}
                <a class="bg-gray-200 py-2 px-3" href="javascript:void(0)">{{.Text}}</a>
                {{else}}
                <a class="border py-2 px-3 border-gray-300 hover:bg-gray-200" href="{{.URL}}">{{.Text}}</a>
                {{end}}
        {{end}}
    {{end}}
</div>
{{end}}
