{{define "pagination"}}
{{if .Data.Pagination}}
{{with .Data.Pagination}}
<div class="flex space-x-2">
    {{if .HasPrev}}
    {{if $.Data.HxTarget}}
    <a class="btn mr-4"
        href="{{.PrevURL}}" hx-get="{{.PrevURL}}" hx-target="{{$.Data.HxTarget}}" hx-swap="outerHTML" hx-push-url="{{if .NoPushURL}}false{{else}}true{{end}}">
        <i class="mdi mdi-chevron-double-left"></i>
    </a>
    {{else}}
    <a class="btn mr-4"
        href="{{.PrevURL}}">
        <i class="mdi mdi-chevron-left"></i>
    </a>
    {{end}}
    {{end}}

    {{if .HasMore}}
    {{if $.Data.HxTarget}}
    <a class="btn"
        href="{{.NextURL}}" hx-get="{{.NextURL}}" hx-target="{{$.Data.HxTarget}}" hx-swap="outerHTML" hx-push-url="{{if .NoPushURL}}false{{else}}true{{end}}">
        <i class="mdi mdi-chevron-double-right"></i>
    </a>
    {{else}}
    <a class="btn"
        href="{{.NextURL}}">
        <i class="mdi mdi-chevron-double-right"></i>
    </a>
    {{end}}
    {{end}}
</div>
{{end}}
{{end}}
{{end}}
