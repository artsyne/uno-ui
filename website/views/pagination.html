{{define "pagination"}}
{{/* hasMore 模式：只显示 prev/next 导航 */}}
{{if .Data.PageLinks}}
<div class="flex space-x-2">
    {{range .Data.PageLinks}}
    {{if $.Data.HxTarget}}
    <a class="border py-2 px-3 border-gray-300 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"
        href="{{.URL}}" hx-get="{{.URL}}" hx-target="{{$.Data.HxTarget}}" hx-push-url="true" hx-swap="outerHTML">
        {{.Text}}
    </a>
    {{else}}
    <a class="border py-2 px-3 border-gray-300 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"
        href="{{.URL}}">{{.Text}}</a>
    {{end}}
    {{end}}
</div>
{{end}}
{{end}}
