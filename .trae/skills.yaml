skills:
  - id: frontend-design
    path: .trae/skills/frontend-design/SKILL.md
    description: Create distinctive, production-grade frontend interfaces with high design quality.
    config:
      frameworks: ['Alpine.js', 'Tailwind CSS', 'Uno UI']
      constraints: ['Production-grade', 'Responsive', 'Accessible']
  - id: brand-guidelines
    path: .trae/skills/brand-guidelines/SKILL.md
    description: Applies the project's official minimalistic design system, focusing on Tailwind CSS 4 utility classes.
    config:
      frameworks: ['Tailwind CSS 4']
      style: 'Minimalist, Grayscale, Bordered'
  - id: backend-best-practices
    path: .trae/skills/backend-best-practices/SKILL.md
    description: Comprehensive guidelines for Go backend development using Gin, adhering to project-specific architecture and standards.
    config:
      frameworks: ['Go 1.25', 'Gin', 'sqlx']
      patterns: ['DDD', 'Repository Pattern', 'Dependency Injection']
  - id: fullstack-testing
    path: .trae/skills/fullstack-testing/SKILL.md
    description: Testing strategy for the Hebe ecosystem, covering Uno UI (Frontend Lib), Website (Consumer), and Go Backend.
    config:
      frameworks: ['Vitest', 'Playwright', 'Testify', 'Go-SQLMock']
      types: ['Unit', 'E2E', 'Integration']
