<div class="modal-body">
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="title" name="title" valid="[{type:'limit',min:1,max:40}]"
            placeholder="日记本名称 *">
        <label for="title">日记本名称 *</label>
    </div>
    <div class="form-floating mb-3">
        <textarea class="form-control" valid="[{type:'limit',max:150,show:true}]" id="remark" name="remark" style="height: 80px"
            placeholder="日记本介绍"></textarea>
        <label for="remark">日记本介绍</label>
    </div>
    <div class="mb-3">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" checked name="view_setting" id="daybook_view_setting1"
                value="1">
            <label class="form-check-label" for="daybook_view_setting1">私人日记本</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="view_setting" id="daybook_view_setting2" value="2">
            <label class="form-check-label" for="daybook_view_setting2">公开日记本</label>
        </div>
        <div class="text-danger">默认为私人日记本，仅自己与该日记本其它作者可浏览，否则公开日记本</div>
    </div>
    <div class="mb-3">
        <label>选择风格</label>
        <div class="d-theme py-3">
            <div class="dtf16 dtfselected" theme="16"></div>
            <div class="dtf15" theme="15"></div>
            <div class="dtf14" theme="14"></div>
            <div class="dtf13" theme="13"></div>
            <div class="dtf12" theme="12"></div>
            <div class="dtf11" theme="11"></div>
            <div class="dtf10" theme="10"></div>
            <div class="dtf9" theme="9"></div>
            <div class="dtf8" theme="8"></div>
            <div class="dtf7" theme="7"></div>
            <div class="dtf6" theme="6"></div>
            <div class="dtf5" theme="5"></div>
            <div class="dtf4" theme="4"></div>
            <div class="dtf3" theme="3"></div>
            <div class="dtf2" theme="2"></div>
            <div class="dtf1" theme="1"></div>
        </div>
    </div>
    <input type="hidden" name="action" id="action" value="My.insertDaybook" />
    <input type="hidden" name="theme_id" id="theme_id" value="16" />
</div>
<div class="modal-footer">
    <button type="button" class="ms-auto btn btn-outline-secondary  px-4" onclick="Biuren.Diary.doDaybook()">保存</button>
</div>
