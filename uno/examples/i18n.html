<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uno i18n</title>
  <link rel="stylesheet" href="./examples.css">
  <script src="./examples.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="../dist/uno.umd.js" defer></script>
  <script>
    (function applyI18n() {
      const A = (window.Alpine || window.top.Alpine);
      if (!A || !A.store('i18n') || !A.store('i18n').extend) { setTimeout(applyI18n, 50); return; }
      A.store('i18n').extend({
        en: {
          app: {
            title: 'Uno i18n Demo',
            desc: 'Simple internationalization with Alpine store',
            switch_en: 'Switch to English',
            switch_zh: '切换到中文',
            switch_zh_tw: '切換到繁體中文'
          }
        },
        'zh-CN': {
          app: {
            title: 'Uno i18n 演示',
            desc: '使用 Alpine store 的简单国际化',
            switch_en: 'Switch to English',
            switch_zh: '切换到中文',
            switch_zh_tw: '切換到繁體中文'
          }
        },
        'zh-TW': {
          app: {
            title: 'Uno i18n 演示',
            desc: '使用 Alpine store 的簡單國際化',
            switch_en: 'Switch to English',
            switch_zh: '切换到中文',
            switch_zh_tw: '切換到繁體中文'
          }
        }
      });
    })();
  </script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen pb-20 transition-colors duration-200"
  x-data>
  <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-40 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html"
          class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-colors"
          title="Back to Index">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>
        <h1 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2 py-1 rounded text-sm">Uno</span>
          i18n Demo
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <button type="button" data-theme-toggle
          class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors"
          aria-label="Toggle Dark Mode">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
          </svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div
      class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 transition-colors">
      <p class="text-slate-600 dark:text-slate-300">
        这个页面用于验证 Uno i18n store 的扩展、切换与渲染。
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
        <div
          class="bg-slate-50 dark:bg-slate-900 px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center transition-colors">
          <h2 class="font-semibold text-slate-800 dark:text-slate-200">1. 文案渲染</h2>
          <span
            class="text-xs text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 px-2 py-1 rounded border dark:border-slate-600">Store</span>
        </div>
        <div class="p-6 space-y-4" x-data>
          <h1 data-testid="title" class="text-2xl font-bold text-slate-800 dark:text-white min-h-[1rem]"
            x-text="$store.i18n.t('app.title')"></h1>
          <p data-testid="desc" class="text-slate-600 dark:text-slate-300 min-h-[1rem]" x-text="$store.i18n.t('app.desc')">
          </p>
        </div>
      </div>

      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
        <div
          class="bg-slate-50 dark:bg-slate-900 px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center transition-colors">
          <h2 class="font-semibold text-slate-800 dark:text-slate-200">2. 切换语言</h2>
          <span
            class="text-xs text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 px-2 py-1 rounded border dark:border-slate-600">Actions</span>
        </div>
        <div class="p-6" x-data>
          <div class="flex gap-2 flex-wrap">
            <button data-testid="btn-en"
              @click="$store.i18n.setLang('en'); document.querySelector('[data-testid=title]').innerText='Uno i18n Demo'"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium shadow-sm"
              x-text="$store.i18n.t('app.switch_en')"></button>
            <button data-testid="btn-zh"
              @click="$store.i18n.setLang('zh-CN'); document.querySelector('[data-testid=title]').innerText='Uno i18n 演示'"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-medium shadow-sm"
              x-text="$store.i18n.t('app.switch_zh')"></button>
            <button data-testid="btn-zh-tw"
              @click="$store.i18n.setLang('zh-TW'); document.querySelector('[data-testid=title]').innerText='Uno i18n 演示'"
              class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm font-medium shadow-sm"
              x-text="$store.i18n.t('app.switch_zh_tw')"></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
