<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box and Tooltip Z-Index Debug</title>
    <link rel="stylesheet" href="./examples.css">
    <script src="./examples.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="../dist/uno.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
    <script>
        (function () {
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('[data-notify-demo]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        const A = window.Alpine || (window.top && window.top.Alpine);
                        const notify = A && A.store ? A.store('notify') : null;
                        if (!notify) return;
                        notify.show('I am a notification', { type: 'success', timeout: 0 });
                    });
                });
            });
        })();
    </script>
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen pb-20 transition-colors duration-200">
    <header
        class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-40 border-b border-slate-200 dark:border-slate-700 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html"
                    class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors"
                    title="Back to Index">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="bg-blue-600 text-white px-2 py-1 rounded text-sm">Uno</span>
                    Box + Tooltip + Notify Debug
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <button type="button" data-theme-toggle
                    class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors"
                    aria-label="Toggle Dark Mode">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <div
            class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 transition-colors">
            <p class="text-slate-600 dark:text-slate-300">
                用于验证 Box / Tooltip / Notify 的层级（z-index）与交互行为。
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div
                class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
                <div
                    class="bg-slate-50 dark:bg-slate-900 px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center transition-colors">
                    <h2 class="font-semibold text-slate-800 dark:text-slate-200">1. Box 内 Tooltip</h2>
                    <span
                        class="text-xs text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 px-2 py-1 rounded border dark:border-slate-600">Z-Index</span>
                </div>
                <div class="p-6 space-y-3">
                    <button type="button" data-box-type="dialog" data-box-trusted="true" data-box-title="Box with Tooltip"
                        data-box-content="<div x-data class='p-4 space-y-4'>
                            <p class='text-slate-700 dark:text-slate-300'>Hover over the button below to see the tooltip.</p>
                            <button class='px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors'
                                    x-tooltip='&quot;I should be ON TOP of the box&quot;'>
                                Hover Me
                            </button>
                            <div class='pt-4 border-t border-slate-200 dark:border-slate-700'>
                                <button class='px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-colors'
                                        @click='$store.uno.notify.show(&quot;I am a notification&quot;, { type: &quot;success&quot;, timeout: 0 })'>
                                    Trigger Notify
                                </button>
                            </div>
                        </div>"
                        class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium shadow-sm">
                        Open Box
                    </button>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        期望：Tooltip 显示在 Box 之上（更高 z-index），Notify 显示在 Tooltip 之上。
                    </p>
                </div>
            </div>

            <div
                class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
                <div
                    class="bg-slate-50 dark:bg-slate-900 px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center transition-colors">
                    <h2 class="font-semibold text-slate-800 dark:text-slate-200">2. 直接触发 Notify</h2>
                    <span
                        class="text-xs text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 px-2 py-1 rounded border dark:border-slate-600">Store</span>
                </div>
                <div class="p-6">
                    <button type="button" data-notify-demo
                        class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-medium shadow-sm">
                        Show Notification
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
