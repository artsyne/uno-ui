    <style type="text/tailwindcss">

    <div class="max-w-md mx-auto space-y-4">
        <h1 class="text-2xl font-bold">Box + Tooltip + Notify Debug</h1>

        <button data-box-type="dialog" data-box-title="Box with Tooltip" data-box-content="<div class='p-4 space-y-4'>
                <p>Hover over the button below to see the tooltip.</p>
                <button class='px-4 py-2 bg-blue-500 text-white rounded' 
                        x-tooltip='&quot;I should be ON TOP of the box&quot;'>
                    Hover Me
                </button>
                <div class='pt-4 border-t'>
                    <button class='px-4 py-2 bg-green-500 text-white rounded'
                            @click='$store.notify.show(&quot;I am a notification&quot;, { type: &quot;success&quot;, timeout: 0 })'>
                        Trigger Notify
                    </button>
                </div>
            </div>" class="px-4 py-2 bg-white border rounded shadow hover:bg-gray-50">
            Open Box
        </button>

        <button id="trigger-notify" @click="$store.notify.show('I am a notification', { type: 'success', timeout: 0 })"
            class="px-4 py-2 bg-green-500 text-white rounded shadow">
            Show Notification
        </button>
    </div>
