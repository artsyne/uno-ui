<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uno HTMX Global Binding Test</title>
    <link rel="stylesheet" href="./examples.css">
    <script src="./examples.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="../dist/uno.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js" defer></script>
    <script>
        // Initialize Uno and bind HTMX events globally to show progress bar
        document.addEventListener('alpine:init', () => {
            // Wait for Uno to be available
            if (window.Uno) {
                // Bind notify functionality to all HTMX requests
                window.Uno.htmx.bindNotifyToHtmx();
            } else {
                // If Uno is not immediately available, try again after a short delay
                setTimeout(() => {
                    if (window.Uno) {
                        window.Uno.htmx.bindNotifyToHtmx();
                    }
                }, 100);
            }
        });
    </script>
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen pb-20 transition-colors duration-200">
    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-40 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="./index.html"
                    class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-colors"
                    title="Back to Index">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="bg-blue-600 text-white px-2 py-1 rounded text-sm">Uno</span>
                    HTMX Global Binding Test
                </h1>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <div
            class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors p-6">
            <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4">HTMX Global Progress Bar Test</h2>
            <p class="text-slate-600 dark:text-slate-300 mb-6">
                When you click the button below, HTMX will make a request and the global progress bar should appear at
                the top of the screen.
            </p>

            <button hx-get="/examples/data/sample.json" hx-target="#result"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                Make HTMX Request
            </button>

            <div id="result" class="mt-4 p-4 bg-slate-100 dark:bg-slate-700 rounded"></div>
        </div>
    </main>
</body>

</html>
