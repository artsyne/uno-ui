<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Minimal Box Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Alpine first -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js" defer></script>
    <!-- Then Uno -->
    <script src="./dist/uno.umd.js" defer></script>
</head>

<body class="p-8">
    <h1 class="text-2xl mb-4">Minimal Box Test</h1>

    <button
        onclick="console.log('Window.Uno:', window.Uno); console.log('Store uno:', window.Alpine?.store('uno')); console.log('Box:', window.Uno?.box || 'MISSING')"
        class="px-4 py-2 bg-gray-600 text-white rounded mb-2">
        Check Console
    </button>

    <button onclick="window.Uno.box.alert('Test Alert')" class="px-4 py-2 bg-blue-600 text-white rounded mb-2">
        Test Alert
    </button>

    <button onclick="window.Alpine.store('uno').box.alert('Via Store')"
        class="px-4 py-2 bg-green-600 text-white rounded">
        Via Store
    </button>

    <script>
        // Debug after load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                console.log('=== After DOMContentLoaded + 1s ===');
                console.log('window.Uno:', window.Uno);
                console.log('window.Alpine:', window.Alpine);
                console.log('Alpine.store("uno"):', window.Alpine?.store('uno'));
                console.log('Uno.box:', window.Uno?.box);
                console.log('typeof Uno.box.alert:', typeof window.Uno?.box?.alert);
            }, 1000);
        });
    </script>
</body>

</html>
