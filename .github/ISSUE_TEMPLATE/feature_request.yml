name: Feature request
description: Suggest a feature or improvement for Uno UI
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Keep the scope aligned with the
        project's Alpine.js + Tailwind CSS + optional HTMX model.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have read the documentation in `docs/`.
          required: true
        - label: I have searched existing issues and discussions.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API shape, directive, configuration or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Does this change existing APIs or bundle size? Does it need HTMX?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
